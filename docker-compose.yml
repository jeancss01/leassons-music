services:
  db:
    image: postgres:16-alpine
    container_name: violao-diario-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: violao
      POSTGRES_PASSWORD: violao
      POSTGRES_DB: violao_diario
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U violao -d violao_diario']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

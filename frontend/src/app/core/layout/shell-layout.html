<mat-sidenav-container class="shell">
  <mat-sidenav
    class="sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="isHandset() ? sidenavOpen() : true"
    (closedStart)="sidenavOpen.set(false)"
  >
    <div class="sidenav-brand">Violão Diário</div>
    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/dashboard"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeSidenavOnMobile()"
      >
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a
        mat-list-item
        routerLink="/students"
        routerLinkActive="active-link"
        (click)="closeSidenavOnMobile()"
      >
        <mat-icon matListItemIcon>groups</mat-icon>
        <span matListItemTitle>Alunos</span>
      </a>
    </mat-nav-list>
    <!-- Espaço reservado: Aulas, Financeiro (globais) -->
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="toolbar">
      @if (isHandset()) {
        <button
          mat-icon-button
          type="button"
          aria-label="Abrir menu"
          (click)="toggleSidenav()"
        >
          <mat-icon>menu</mat-icon>
        </button>
      }
      <a routerLink="/dashboard" class="toolbar-title">Violão Diário</a>
      <span class="spacer"></span>
      <button mat-button type="button" (click)="logout()">Sair</button>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
